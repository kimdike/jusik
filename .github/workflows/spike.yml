name: 급변동 감지 (단톡방)

# 단톡방 종목 중 전일 대비 급등/급락한 종목만 골라 그 종목 알림을 즉시 보낸다.
# 기준은 종목별 최근 60일 변동률의 90분위 — "이 종목 기준으로 10일에 한 번쯤 있는 움직임".
# 같은 종목은 더 벌어질 때만 다시 알린다(data/spike_state.json 단계 기록).
#
# 스케줄은 Cloudflare Workers(deploy/cloudflare-worker)가 담당한다.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-alert
  cancel-in-progress: false     # 상태 파일이 겹쳐 쓰이면 중복/누락이 생긴다

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 한글 폰트 설치 (차트 이미지 한글 표시용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum && fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-alerts.txt

      - name: 의존성 설치 (경량)
        run: pip install -r requirements-alerts.txt

      # 그날 도달한 최고 단계를 실행 간에 유지해야 도배를 막을 수 있다 (롤링 캐시)
      - name: 직전 급변동 상태 복원
        uses: actions/cache@v4
        with:
          path: data/spike_state.json
          key: spike-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            spike-state-

      - name: 급변동 점검 후 발송
        env:
          TELEGRAM_GROUP_BOT_TOKEN: ${{ secrets.TELEGRAM_GROUP_BOT_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python alerts_run.py --spike
