name: 아침 브리핑

# 평일 아침 2회 발송:
#   08:30 KST — 장 전 예고 (전일 종가 기준, 신호 강한 순)
#   09:30 KST — 장 시작 30분 후 시황 (시초가 반영, 움직임 큰 순)

on:
  # 스케줄은 Cloudflare Workers(deploy/cloudflare-worker)가 담당한다.
  # GitHub 의 schedule: 은 무료 러너에서 조용히 누락되므로(실측 1~4시간 지연) 제거함.
  # 워커가 GitHub API 로 workflow_dispatch 를 호출한다.
  workflow_dispatch:
    inputs:
      kind:
        description: "브리핑 종류"
        type: choice
        options: [pre, open]
        default: pre

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-alerts.txt

      - name: 의존성 설치 (경량)
        run: pip install -r requirements-alerts.txt

      # 어느 cron이 돌았는지로 브리핑 종류를 고른다 (수동 실행이면 입력값 사용)
      - name: 브리핑 종류 결정
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 0 * * 1-5" ]; then
            echo "kind=open" >> "$GITHUB_OUTPUT"
          else
            echo "kind=pre" >> "$GITHUB_OUTPUT"
          fi

      - name: 브리핑 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerts_run.py --brief ${{ steps.kind.outputs.kind }}
