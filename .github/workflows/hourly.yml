name: 정시 점검 (1시간마다)

# 신호가 안 바뀌어도 1시간마다 워치리스트 전 종목 상태를 1통으로 보낸다.
#   한국장  10:00~15:00 KST  (09:30 장 시작 브리핑, 16:00 하루정리와 겹치지 않게)
#   미국장  23:00~06:00 KST
# (신호 변경 즉시 알림은 alerts.yml 이 그대로 담당 — 이건 정기 스냅샷)

on:
  # 스케줄은 Cloudflare Workers(deploy/cloudflare-worker)가 담당한다.
  # GitHub 의 schedule: 은 무료 러너에서 조용히 누락되므로(실측 1~4시간 지연) 제거함.
  # 워커가 GitHub API 로 workflow_dispatch 를 호출한다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-brief
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-alerts.txt

      - name: 의존성 설치 (경량)
        run: pip install -r requirements-alerts.txt

      - name: 정시 점검 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerts_run.py --brief hourly
