name = "jusik-scheduler"
main = "worker.js"
compatibility_date = "2026-07-01"

# 공개 URL 을 만들지 않는다. 필요한 건 크론 트리거뿐이고,
# 주소가 열려 있으면 수동 실행 엔드포인트(?run=)가 인증 없이 노출된다.
# (그래도 worker.js 쪽에 시크릿 검사를 둬서 이중으로 막아둠)
workers_dev = false

# 5분마다 깨어나서, 그 시각에 돌려야 할 워크플로우를 worker.js 의 SCHEDULE 표로 판단한다.
# (크론 트리거를 하나만 쓰므로 무료 플랜 한도를 신경 쓸 필요 없음)
[triggers]
crons = ["*/5 * * * *"]
